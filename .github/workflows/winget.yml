name: Publish to WinGet
on:
  release:
    types: [released]
jobs:
  publish:
    runs-on: windows-latest # action can only be run on windows
    steps:
      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: Balena.Etcher
          # Tauri produces: balenaEtcher_2.1.4_x64-setup.exe or balenaEtcher_2.1.4_x64_en-US.msi
          installers-regex: 'balenaEtcher_[\d.]+_x64(-setup\.exe|_en-US\.msi)$'
          token: ${{ secrets.WINGET_PAT }}
